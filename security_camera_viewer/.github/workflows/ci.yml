name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Build release
      run: cargo build --release --verbose

  windows-build:
    # X-5e: Windows ネイティブビルド検証 (PENDING_NFR_WORK.md / Q21)
    # ターゲット: Spresense PC viewer は Linux/WSL2 で開発しているが、
    # 本番運用想定として Windows 環境でもビルド可能であることを CI で常時検証する。
    name: Build and Test (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build (CLI binary)
      run: cargo build --verbose

    - name: Build (GUI binary)
      run: cargo build --features gui --bin security_camera_gui --verbose

    - name: Run tests
      # GUI feature を含めたテストを実行 (recording_browser など)
      run: cargo test --features gui --bin security_camera_gui --verbose

    - name: Build release (CLI + GUI)
      run: |
        cargo build --release --verbose
        cargo build --release --features gui --bin security_camera_gui --verbose

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Run benchmarks
      run: cargo bench --verbose

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: target/criterion/

  coverage:
    # X-8 Stage 1: 行カバレッジ自動測定 (cargo-llvm-cov, Phase 12.1 完了 2026-05-08)
    # 旧 cargo-tarpaulin から cargo-llvm-cov に切替 (より正確で高速、rustc 公式機能ベース)
    name: Code Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage (LCOV)
      run: cargo llvm-cov --features gui --workspace --lcov --output-path lcov.info

    - name: Print summary
      run: cargo llvm-cov --features gui --workspace --summary-only

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Coverage threshold check
      # 現状ベースライン 16.75% を出発点とし、後退を防ぐ。
      # Phase 12.1 改訂: TEST_COVERAGE_BASELINE.md v1.1 §Stage 4 の 1 ヶ月目標 = 25%
      # 段階的にこの値を引き上げる。
      run: |
        cargo llvm-cov --features gui --workspace --summary-only 2>&1 | tee summary.txt
        # 抽出: TOTAL 行から Lines % を取得 (gawk フィールド 10 = Lines Cover)
        TOTAL_LINE_COV=$(grep '^TOTAL' summary.txt | awk '{print $10}' | tr -d '%')
        echo "TOTAL line coverage: ${TOTAL_LINE_COV}%"
        # 16.0 を最低ライン (現状 16.75% ベースラインからの後退検出)
        awk -v cov="$TOTAL_LINE_COV" 'BEGIN{ exit (cov+0 < 16.0) }' || {
          echo "::error::Line coverage ${TOTAL_LINE_COV}% is below baseline 16.0%"
          exit 1
        }
